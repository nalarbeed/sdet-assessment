name: Mobile CI (manual)

# Best-effort manual workflow only. Mobile tests need an emulator + Appium, so
# they are not part of the push/pull_request CI (see .github/workflows/ci.yml).
on:
  workflow_dispatch:

jobs:
  mobile-tests:
    name: Mobile tests (emulator)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm i -g appium
          appium driver install uiautomator2

      # As documented by reactivecircus/android-emulator-runner.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-mobile-tests.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-allure-results
          path: mobile-api-tests/target/allure-results
          if-no-files-found: ignore
