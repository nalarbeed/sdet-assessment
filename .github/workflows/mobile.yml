name: Mobile CI (manual)

# Best-effort manual workflow only. Mobile tests need an emulator + Appium, so
# they are not part of the push/pull_request CI (see .github/workflows/ci.yml).
on:
  workflow_dispatch:

jobs:
  mobile-tests:
    name: Mobile tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm i -g appium
          appium driver install uiautomator2

      # As documented by reactivecircus/android-emulator-runner.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e

            # Appium needs aapt2/apksigner to read the APK manifest, but it looks
            # for them in platform-tools (not build-tools/<ver>) on this setup, as
            # observed locally. Install build-tools 34 and expose the binaries.
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            BT="$SDK/build-tools/34.0.0"
            if [ ! -x "$BT/aapt2" ]; then
              SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
              [ -x "$SDKMGR" ] || SDKMGR="sdkmanager"
              yes | "$SDKMGR" --install "build-tools;34.0.0" >/dev/null 2>&1 || true
            fi
            if [ -x "$BT/aapt2" ]; then ln -sf "$BT/aapt2" "$SDK/platform-tools/aapt2"; fi
            if [ -f "$BT/lib/apksigner.jar" ]; then ln -sf "$BT/lib/apksigner.jar" "$SDK/platform-tools/apksigner.jar"; fi

            # Start Appium in the background with chromedriver auto-download enabled.
            appium --allow-insecure=uiautomator2:chromedriver_autodownload > appium.log 2>&1 &

            # Wait until Appium answers (curl retry loop, no sleep).
            curl -sS --retry 60 --retry-connrefused --retry-delay 0 --retry-all-errors \
              http://127.0.0.1:4723/status
            echo

            # UiAutomator2 targets the single connected emulator; the runner uses
            # port 5554, so pin the device name to that udid for the CI emulator.
            ./mvnw -B test -pl mobile-api-tests \
              "-Dcucumber.filter.tags=@mobile and not @fail-case" \
              -Dappium.device.name=emulator-5554

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-allure-results
          path: mobile-api-tests/target/allure-results
          if-no-files-found: ignore
